name: Remove demonstration release attachments
on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-release-media.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep only the HTML release attachment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for asset in compromise-hunting-atlas-preview-en-US.gif compromise-hunting-atlas-preview-zh-CN.gif; do
            if gh release view v0.1.1 --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
              gh release delete-asset v0.1.1 "$asset" --yes
            fi
          done
          gh release edit v0.1.1 --notes-file .github/release-notes/v0.1.1.md
